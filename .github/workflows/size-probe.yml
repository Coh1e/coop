name: Size probe

# Temporary measurement job for issue #90. It builds the branch and the same tree with main's
# CMakeLists.txt on one runner, so the before/after pair shares a toolchain and a runner image.
# Delete this file once the numbers are recorded in the issue and docs/performance-support.md.

on:
  push:
    branches: ['size-o1']
  workflow_dispatch:

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned dependencies
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Measure the pre-landing tree (main's CMakeLists.txt)
        shell: pwsh
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- CMakeLists.txt
          ./scripts/build.ps1 -Action configure
          ./scripts/build.ps1 -Action build
          $asset = Join-Path $env:RUNNER_TEMP 'coop-pre.zip'
          Compress-Archive -Path ./.local/build/coop.exe, ./.local/build/scoop-lib, ./.local/build/licenses, ./LICENSE, ./THIRD_PARTY.md -DestinationPath $asset -Force
          ./scripts/check-size.ps1 -LimitBytes 9000000 -ZipPath $asset

      - name: Measure the branch (/O1 for coop's C++ units)
        shell: pwsh
        run: |
          git checkout HEAD -- CMakeLists.txt
          ./scripts/build.ps1 -Action configure
          ./scripts/build.ps1 -Action build
          $asset = Join-Path $env:RUNNER_TEMP 'coop-post.zip'
          Compress-Archive -Path ./.local/build/coop.exe, ./.local/build/scoop-lib, ./.local/build/licenses, ./LICENSE, ./THIRD_PARTY.md -DestinationPath $asset -Force
          ./scripts/check-size.ps1 -LimitBytes 9000000 -ZipPath $asset
