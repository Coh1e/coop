name: Release

# A v* tag publishes the binary that ci.yml already tested. The suite stays in ci.yml so tagging
# does not repeat the 45-minute run; the version check below refuses a tag that does not match the
# binary about to be uploaded, and the unpacked archive is smoke-tested before it is attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read the tagged version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$env:GITHUB_REF_NAME' is not v<major>.<minor>.<patch>"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Fetch pinned dependencies
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Configure
        shell: pwsh
        run: ./scripts/build.ps1 -Action configure

      - name: Build Release
        shell: pwsh
        run: ./scripts/build.ps1 -Action build

      - name: Check the binary reports the tagged version
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $reported = (& ./.local/build/coop.exe --version | Out-String).Trim()
          if ($reported -ne "coop $version") {
            throw "coop.exe reports '$reported', but the tag is v$version"
          }

      - name: Package and smoke-test the archive
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $asset = "coop-v$version-x64.zip"
          Compress-Archive -Path ./.local/build/coop.exe, ./.local/build/scoop-lib, ./.local/build/licenses, ./LICENSE, ./THIRD_PARTY.md -DestinationPath $asset
          Expand-Archive -Path $asset -DestinationPath ./.local/release-check
          if (-not (Test-Path ./.local/release-check/scoop-lib/core.ps1)) {
            throw 'scoop-lib was not packaged beside coop.exe'
          }
          if (-not (Test-Path ./.local/release-check/LICENSE)) {
            throw 'LICENSE was not packaged'
          }
          $reported = (& ./.local/release-check/coop.exe --version | Out-String).Trim()
          if ($reported -ne "coop $version") {
            throw "the unpacked coop.exe reports '$reported', but the tag is v$version"
          }
          $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLower()
          "sha256 $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          gh release create $env:GITHUB_REF_NAME "coop-v$version-x64.zip" --verify-tag --title $env:GITHUB_REF_NAME --generate-notes
