name: CI

# The local guardrails (pre-commit hook, scripts/build.ps1) only run when someone remembers to run
# them. This workflow is the net that does not depend on memory: every push and pull request builds
# the project and runs the full CTest suite on a clean machine.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned dependencies
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Source hygiene
        shell: pwsh
        run: ./scripts/check-source-hygiene.ps1

      # Facts that the tests depend on. Printed before the suite so a failure can be read against the
      # machine it happened on instead of guessed at.
      - name: Environment facts
        shell: pwsh
        run: |
          Write-Output "corpus jq sha256: $((Get-FileHash tests/corpus/main/jq.json -Algorithm SHA256).Hash.ToLower())"
          $bytes = [IO.File]::ReadAllBytes('tests/corpus/main/jq.json')
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          Write-Output "corpus jq crlf=$(([regex]::Matches($text,"`r`n")).Count) lf=$(([regex]::Matches($text,"(?<!`r)`n")).Count) size=$($bytes.Length)"
          Write-Output "autocrlf: $(git config --get core.autocrlf)"
          Write-Output "gitattributes: $(git check-attr text -- tests/corpus/main/jq.json)"
          Write-Output "JAVA_HOME=$env:JAVA_HOME"
          Write-Output "python: $((Get-Command python.exe -ErrorAction SilentlyContinue).Source)"
          Write-Output "tar: $((Get-Command tar.exe -ErrorAction SilentlyContinue).Source)"
          Write-Output "cmake: $(cmake --version | Select-Object -First 1)"
          Write-Output "ninja: $(ninja --version)"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolset = Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Write-Output "msvc toolset: $($toolset.Name)"

      - name: Configure, build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Action all
